[package]
name = "drydock-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
drydock-provider = { path = "../drydock-provider" }
drydock-protocol = { path = "../drydock-protocol" }
rigging-http-client.workspace = true
rigging-stream.workspace = true
rigging-tls.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait = "0.1"
async-stream = "0.3"
reqwest = { workspace = true, features = ["json", "stream", "query"] }
http.workspace = true
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["sync", "time", "io-util"] }
thiserror = "2"
json-patch = "4.2.0"
axum = "0.8"
tower-http = { version = "0.7.1", features = ["sensitive-headers"] }
tracing = "0.1.44"
serde_path_to_error = "0.1.20"

utoipa.workspace = true
utoipa-axum = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net"] }
tempfile = "3"
hegeltest = "=0.48.1"
regex = "1"
chrono = "0.4"
jsonschema = { version = "0.60.2", default-features = false }
