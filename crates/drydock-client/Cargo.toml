[package]
name = "drydock-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
drydock-protocol = { path = "../drydock-protocol" }
rigging-http-client.workspace = true
rigging-stream.workspace = true
rigging-tls.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "query"] }
http = "1"
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["sync", "time", "io-util"] }
thiserror = "2"
