[package]
name = "drydock-transport"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# The WebSocket dialer and tunnel stream, for modules whose provider relays a
# guest TCP port over a WebSocket. Off by default, so the agent carries no
# WebSocket or TLS client of its own.
websocket = ["dep:tokio-tungstenite", "dep:futures-util", "dep:rustls", "dep:rustls-platform-verifier", "dep:tokio-rustls"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio"] }
bytes = "1"
getrandom = "0.3"
sha2.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "service", "server-auto"] }
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time", "macros", "process", "fs"] }
tempfile = "3"
futures-util = { version = "0.3", default-features = false, features = ["sink"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"], optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
futures = "0.3"
hegeltest = "=0.48.1"

[[test]]
name = "websocket"
required-features = ["websocket"]
