[package]
name = "drydock-transport"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio"] }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "service", "server-auto"] }
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time", "macros", "process", "fs"] }
tempfile = "3"
tracing = { version = "0.1", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
futures = "0.3"
