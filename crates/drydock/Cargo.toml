[package]
name = "drydock"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
drydock-provider = { path = "../drydock-provider" }
drydock-agent = { path = "../drydock-agent" }
drydock-transport = { path = "../drydock-transport", features = ["websocket"] }
drydock-oci = { path = "../drydock-oci" }
percent-encoding = "2"
rigging-paths.workspace = true
rigging-http-serve.workspace = true
rigging-http-client.workspace = true
rigging-tls.workspace = true
rigging-stream.workspace = true
rigging-relay-protocol.workspace = true
reqwest = { workspace = true, features = ["json", "stream", "query"] }
sha2.workspace = true
http.workspace = true
bytes = "1"
axum = "0.8"
toml = "1.0"
tempfile = "3"
async-stream = "0.3"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
drydock-client = { path = "../drydock-client" }
drydock-protocol = { path = "../drydock-protocol" }
rigging-process.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal", "net", "io-util", "process"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
chrono = "0.4"
libc = "0.2"
rustix = { version = "1", features = ["process"] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
base64 = "0.22"
drydock-host = { path = "../drydock-host" }
tempfile = "3"
tokio = { version = "1", features = ["process", "io-util", "test-util"] }
hegeltest = "=0.48.1"
rigging-replay-testkit.workspace = true
