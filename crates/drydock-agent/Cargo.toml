[package]
name = "drydock-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
drydock-transport = { path = "../drydock-transport" }
axum = { version = "0.8", default-features = false, features = ["http2", "tokio", "json"] }
bytes = "1"
http = "1"
http-body-util = "0.1"
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "process", "sync", "fs", "time"] }
tokio-stream = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = "0.7"

[dev-dependencies]
hegeltest = "=0.48.1"
