[package]
name = "drydock-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
drydock-transport = { path = "../drydock-transport" }
drydock-protocol = { path = "../drydock-protocol" }
axum = { version = "0.8", default-features = false, features = ["http2", "tokio", "json"] }
percent-encoding = "2"
bytes = "1"
http = "1"
hickory-proto = { version = "0.25", default-features = false }
http-body-util = "0.1"
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2 = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "process", "sync", "fs", "time"] }
tokio-stream = "0.1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
headers = "0.4"
thiserror = "2"
getrandom = "0.3"
tower-http = { version = "0.6", features = ["catch-panic"] }
rustix = { version = "1", features = ["process"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
hegeltest = "=0.48.1"
