[package]
name = "drydock-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
drydock-transport = { path = "../drydock-transport" }
drydock-protocol = { path = "../drydock-protocol" }
axum = { version = "0.8", default-features = false, features = ["http2", "tokio", "json", "query"] }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body = "1"
percent-encoding = "2"
rustix = { version = "1", features = ["fs", "process"] }
serde_urlencoded = "0.7"
tar = { version = "0.4", default-features = false }
tokio-util = { version = "0.7", features = ["codec", "io", "io-util"] }
bytes = "1"
http = "1"
hickory-proto = { version = "0.25", default-features = false }
http-body-util = "0.1"
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# SO_MARK and original-destination APIs require the all feature.
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "process", "sync", "fs", "time"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
headers = "0.4"
thiserror = "2"
getrandom = "0.3"
tower-http = { version = "0.6", features = ["catch-panic"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
url = "2"
webpki-root-certs = "1"

[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = "0.7"

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["test-util"] }
hegeltest = "=0.48.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
