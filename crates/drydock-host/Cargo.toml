[package]
name = "drydock-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
drydock-protocol = { path = "../drydock-protocol" }
rigging-http-client.workspace = true
rigging-http-serve.workspace = true
drydock-transport = { path = "../drydock-transport" }
rigging-tls.workspace = true
async-trait = "0.1"
axum = "0.8"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
async-stream = "0.3"
chrono = "0.4"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }

[dev-dependencies]
rigging-replay-testkit.workspace = true
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "query"] }
futures = "0.3"
hegeltest = "=0.48.1"
