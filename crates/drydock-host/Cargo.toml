[package]
name = "drydock-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
drydock-provider = { path = "../drydock-provider" }
reqwest = { workspace = true, features = ["json", "query"] }
sha2.workspace = true
drydock-protocol = { path = "../drydock-protocol" }
futures = "0.3"
rigging-http-client.workspace = true
rigging-http-serve.workspace = true
rigging-stream.workspace = true
async-trait = "0.1"
axum = "0.8"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time", "signal"] }
async-stream = "0.3"
chrono = "0.4"
url = "2"
base64 = "0.22"
bytes = "1"
http.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
libc = "0.2"
drydock = { path = "../drydock" }
tokio = { version = "1", features = ["process", "test-util"] }
rigging-tls.workspace = true
rigging-replay-testkit.workspace = true
tempfile = "3"
reqwest = { workspace = true, features = ["json", "stream", "query"] }
hegeltest = "=0.48.1"
http.workspace = true
bytes = "1"
