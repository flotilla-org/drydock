name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The remaining steps skip until the first crate lands (drydock#7).
      - name: Check for a Cargo workspace
        id: workspace
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      # The transport crate's SSH contract tests start a disposable loopback sshd.
      - name: Install SSH test prerequisites
        if: steps.workspace.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client openssh-server
          sudo mkdir -p /run/sshd
      - name: Install pinned Rust
        if: steps.workspace.outputs.present == 'true'
        run: rustup show
      - if: steps.workspace.outputs.present == 'true'
        run: cargo fmt --all -- --check
      - if: steps.workspace.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - if: steps.workspace.outputs.present == 'true'
        run: cargo test --workspace --locked
      - name: Test compile-time tools selection with fixture metadata
        if: steps.workspace.outputs.present == 'true'
        env:
          DRYDOCK_TOOLS_IMAGE: registry.example/test/drydock-tools@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: cargo test --locked -p drydock --test cli
      - if: steps.workspace.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Node for the TypeScript companion
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Check TypeScript companion and endpoint conformance
        env:
          COREPACK_HOME: ${{ runner.temp }}/drydock-corepack-home
        run: |
          mkdir -m 700 -p "$COREPACK_HOME"
          npm install --prefix "$RUNNER_TEMP/drydock-corepack" corepack@0.35.0
          export PATH="$RUNNER_TEMP/drydock-corepack/node_modules/.bin:$PATH"
          cd hosts/typescript
          corepack pnpm install --frozen-lockfile
          corepack pnpm check
          corepack pnpm conformance
      - name: Validate OpenAPI 3.1
        if: steps.workspace.outputs.present == 'true'
        run: |
          python -m pip install openapi-spec-validator==0.7.2
          python -m openapi_spec_validator openapi.json
