name: Vessel tools image
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['crates/drydock/tools-image.txt']
  # Rebuilds and publishes from main even when no input changed.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  script-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup show
      - run: python3 -m unittest discover -s ci -p 'test_tools_*.py'
  # The image holds only the agent build, so a change that leaves the agent's
  # inputs alone keeps the published image and opens no pin PR.
  inputs:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show
      - id: decide
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: python3 ci/tools_inputs.py --base "$BASE" --head "$GITHUB_SHA"
  # Each platform builds and is checked on a runner of its own architecture,
  # so nothing is compiled or tested under emulation.
  platform:
    needs: [script-tests, inputs]
    if: needs.inputs.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      DRYDOCK_TOOLS_REGISTRY: ${{ vars.DRYDOCK_TOOLS_REGISTRY || 'ghcr.io/flotilla-org' }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/${{ matrix.arch }} without publishing
        if: env.PUBLISH != 'true'
        run: python3 ci/tools_image.py --revision "$GITHUB_SHA" --platform "linux/${{ matrix.arch }}"
      - name: Select registry host
        if: env.PUBLISH == 'true'
        id: registry
        run: echo "host=${DRYDOCK_TOOLS_REGISTRY%%/*}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.DRYDOCK_TOOLS_USERNAME || github.actor }}
          password: ${{ secrets.DRYDOCK_TOOLS_PASSWORD || secrets.GITHUB_TOKEN }}
      - name: Publish linux/${{ matrix.arch }} image by digest
        if: env.PUBLISH == 'true'
        run: >-
          python3 ci/tools_image.py --revision "$GITHUB_SHA" --registry "$DRYDOCK_TOOLS_REGISTRY"
          --publish --platform "linux/${{ matrix.arch }}"
      - name: Stock Ubuntu runtime acceptance on ${{ matrix.arch }}
        if: env.PUBLISH == 'true'
        run: python3 ci/test_tools_runtime.py --arch "${{ matrix.arch }}" "$(cat target/tools-image/platform-${{ matrix.arch }}.txt)"
      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          name: tools-platform-${{ matrix.arch }}
          path: target/tools-image/platform-${{ matrix.arch }}.txt
          if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: platform
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      packages: write
    env:
      DRYDOCK_TOOLS_REGISTRY: ${{ vars.DRYDOCK_TOOLS_REGISTRY || 'ghcr.io/flotilla-org' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: tools-platform-*
          path: target/tools-platform
          merge-multiple: true
      - name: Select registry host
        id: registry
        run: echo "host=${DRYDOCK_TOOLS_REGISTRY%%/*}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.DRYDOCK_TOOLS_USERNAME || github.actor }}
          password: ${{ secrets.DRYDOCK_TOOLS_PASSWORD || secrets.GITHUB_TOKEN }}
      - name: Assemble the tools index from both platform images
        run: >-
          python3 ci/tools_image.py --revision "$GITHUB_SHA" --registry "$DRYDOCK_TOOLS_REGISTRY" --publish
          --assemble "$(cat target/tools-platform/platform-amd64.txt)" "$(cat target/tools-platform/platform-arm64.txt)"
      # Pull each platform image by its own digest: the local image store can't
      # hold two platforms under one index digest ("cannot overwrite digest").
      - name: Verify public anonymous pulls on both architectures
        run: |
          anonymous=$(mktemp -d)
          trap 'rm -rf "$anonymous"' EXIT
          docker --config "$anonymous" buildx imagetools inspect "$(cat target/tools-image/tools-image.txt)"
          for arch in amd64 arm64; do
            docker --config "$anonymous" pull "$(cat "target/tools-platform/platform-$arch.txt")"
          done
      # The host pushes the agent build matching each guest's hello platform,
      # so the release carries the exact agent from each published platform
      # image, installed beside drydockd as drydock-agent-linux-<arch>.
      - name: Extract each platform's agent from its published image
        run: |
          mkdir -p target/release
          for arch in amd64 arm64; do
            container=$(docker create --platform "linux/$arch" "$(cat "target/tools-platform/platform-$arch.txt")" /opt/drydock/drydock-agent)
            docker cp "$container:/opt/drydock/drydock-agent" "target/release/drydock-agent-linux-$arch"
            docker rm "$container"
          done
          file target/release/drydock-agent-linux-amd64 | grep -q 'ELF 64-bit LSB.*x86-64'
          file target/release/drydock-agent-linux-arm64 | grep -q 'ELF 64-bit LSB.*ARM aarch64'
          chmod 0755 target/release/drydock-agent-linux-amd64 target/release/drydock-agent-linux-arm64
      - name: Stamp matching tools into drydock build
        run: echo "DRYDOCK_TOOLS_IMAGE=$(cat target/tools-image/tools-image.txt)" >> "$GITHUB_ENV"
      - name: Test stamped prepare and launch
        run: |
          rustup show
          cargo test --locked -p drydock --test cli
      - name: Build release using this tools index
        run: cargo build --locked --release -p drydock -p drydock-host
      - uses: actions/upload-artifact@v4
        with:
          name: drydock-with-tools-image
          path: |
            target/tools-image/tools-image.txt
            target/tools-image/revision.txt
            target/tools-platform/platform-amd64.txt
            target/tools-platform/platform-arm64.txt
            target/release/drydock
            target/release/drydockd
            target/release/drydock-host
            target/release/drydock-agent-linux-amd64
            target/release/drydock-agent-linux-arm64
      - name: Update checked-in bootstrap pin
        run: cp target/tools-image/tools-image.txt crates/drydock/tools-image.txt
      - name: Open pin-bump PR for operator review
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.DRYDOCK_PIN_PR_TOKEN || github.token }}
          branch: automation/drydock-tools-pin
          base: main
          add-paths: crates/drydock/tools-image.txt
          commit-message: Bump published drydock tools image pin
          title: Bump published drydock tools image pin
          body: |
            Published and anonymously verified bootstrap tools image:
            `${{ env.DRYDOCK_TOOLS_IMAGE }}`

            Each platform image was built and checked on stock Ubuntu on a
            runner of its own architecture.

            This pin can lag the host build: a fingerprint mismatch at hello
            triggers push plus re-exec of the host's current agent. Operator
            review and merge are required; this PR is never auto-merged.
