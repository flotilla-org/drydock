[workspace]
members = ["crates/drydock-protocol", "crates/drydock-transport", "crates/drydock-host"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flotilla-org/drydock"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = "5.4"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
