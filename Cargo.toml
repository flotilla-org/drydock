[workspace]
members = ["crates/drydock-protocol", "crates/drydock-transport", "crates/drydock-host"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flotilla-org/drydock"

[workspace.dependencies]
rigging-stream = { git = "https://github.com/flotilla-org/rigging", rev = "9c553b12c9922ade32ef66185884be2114c1981b" }
rigging-replay-testkit = { git = "https://github.com/flotilla-org/rigging", rev = "9c553b12c9922ade32ef66185884be2114c1981b" }
rigging-http-client = { git = "https://github.com/flotilla-org/rigging", rev = "9c553b12c9922ade32ef66185884be2114c1981b" }
rigging-http-serve = { git = "https://github.com/flotilla-org/rigging", rev = "9c553b12c9922ade32ef66185884be2114c1981b" }
rigging-tls = { git = "https://github.com/flotilla-org/rigging", rev = "9c553b12c9922ade32ef66185884be2114c1981b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = "5.4"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
