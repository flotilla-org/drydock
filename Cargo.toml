[workspace]
members = ["crates/drydock-provider", "crates/drydock-agent", "crates/drydock-protocol", "crates/drydock-transport", "crates/drydock-host", "crates/drydock-client", "crates/drydock"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flotilla-org/drydock"

[workspace.dependencies]
rigging-paths = { git = "https://github.com/flotilla-org/rigging", rev = "3c60c7ae62a1b93f910b7049d90ae97bf8275837" }
reqwest = { version = "0.13", default-features = false }
http = "1"
sha2 = "0.10"
rigging-process = { git = "https://github.com/flotilla-org/rigging", rev = "3c60c7ae62a1b93f910b7049d90ae97bf8275837" }
rigging-stream = { git = "https://github.com/flotilla-org/rigging", rev = "3c60c7ae62a1b93f910b7049d90ae97bf8275837" }
rigging-replay-testkit = { git = "https://github.com/flotilla-org/rigging", rev = "3c60c7ae62a1b93f910b7049d90ae97bf8275837" }
rigging-http-client = { git = "https://github.com/flotilla-org/rigging", rev = "3c60c7ae62a1b93f910b7049d90ae97bf8275837" }
rigging-http-serve = { git = "https://github.com/flotilla-org/rigging", rev = "3c60c7ae62a1b93f910b7049d90ae97bf8275837" }
rigging-tls = { git = "https://github.com/flotilla-org/rigging", rev = "3c60c7ae62a1b93f910b7049d90ae97bf8275837" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
utoipa = "5.4"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Large-transfer tests hash and frame hundreds of MiB; unoptimized hashing and
# framing would dominate their runtime without changing what they show.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.h2]
opt-level = 3
[profile.dev.package.hyper]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
