[workspace]
members = ["crates/drydock-protocol"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flotilla-org/drydock"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = "5.4"
